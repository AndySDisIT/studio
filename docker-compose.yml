version: '3.8'

services:
  # Development service
  cruizr-dev:
    container_name: cruizr-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "9002:9002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      - GOOGLE_GENKIT_API_KEY=${GOOGLE_GENKIT_API_KEY}
    env_file:
      - .env.local
    command: npm run dev
    restart: unless-stopped
    networks:
      - cruizr-network

  # Production service (for local testing)
  cruizr-prod:
    container_name: cruizr-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      - GOOGLE_GENKIT_API_KEY=${GOOGLE_GENKIT_API_KEY}
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - cruizr-network
    profiles:
      - production

networks:
  cruizr-network:
    driver: bridge
